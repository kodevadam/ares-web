<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Cross-Origin Isolation (required for SharedArrayBuffer / WASM threads) -->
  <!-- Also enforced by the service worker for pre-cached navigations. -->
  <meta http-equiv="Cross-Origin-Opener-Policy"   content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>ares N64</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header>
  <h1>ares N64</h1>
  <div id="controls">
    <button id="btn-load" onclick="document.getElementById('rom-input').click()"
            title="Load ROM (z64/n64/v64)">Load ROM</button>
    <button onclick="window.resetEmulator?.()" title="Soft-reset the console">Reset</button>
    <button onclick="enterFullscreen()"  title="Fullscreen">⛶</button>
    <button onclick="toggleTouchControls?.()" title="Virtual gamepad">🎮</button>
    <button onclick="toggleKeyRef()"     title="Keyboard reference">⌨</button>
    <button onclick="toggleSettings()"   title="Settings">⚙</button>
  </div>
</header>

<input type="file" id="rom-input" accept=".z64,.n64,.v64,.rom">

<!-- ── Canvas area ─────────────────────────────────────────────────────── -->
<div id="canvas-container">
  <canvas id="ares-canvas" width="640" height="480" tabindex="0"></canvas>

  <div id="drop-overlay">
    <div class="icon">🎮</div>
    <p>Drop an N64 ROM here</p>
    <p>or click <strong>Load ROM</strong></p>
  </div>
</div>

<!-- ── Footer ──────────────────────────────────────────────────────────── -->
<footer>
  <span>ares N64 — WebAssembly</span>
  <span id="status">Loading…</span>
  <span id="fps"></span>
</footer>

<!-- ── Key reference panel ─────────────────────────────────────────────── -->
<div id="key-ref">
  <h3>Keyboard</h3>
  <table>
    <tr><td>Enter</td>       <td>Start</td></tr>
    <tr><td>A</td>           <td>Z trigger</td></tr>
    <tr><td>Z / X</td>       <td>A / B</td></tr>
    <tr><td>I/J/K/L</td>     <td>C-Up/Left/Down/Right</td></tr>
    <tr><td>W/S/Q/D</td>     <td>Stick ↑↓←→</td></tr>
    <tr><td>↑↓←→</td>       <td>D-pad</td></tr>
    <tr><td>Shift L/R</td>   <td>L / R</td></tr>
  </table>
</div>

<!-- ── Settings panel ──────────────────────────────────────────────────── -->
<div id="settings-panel">
  <h3>Settings</h3>
  <label>
    <span>Volume</span>
    <input id="vol-slider" type="range" min="0" max="100" value="80"
           oninput="setVolume(this.value)">
    <span id="vol-label">80%</span>
  </label>
  <label>
    <span>Scale</span>
    <select id="scale-select" onchange="setScale(this.value)">
      <option value="fit"  selected>Fit window</option>
      <option value="1x">1×</option>
      <option value="2x">2×</option>
      <option value="3x">3×</option>
    </select>
  </label>
  <label>
    <span>Touch controls</span>
    <input type="checkbox" id="touch-toggle" onchange="toggleTouchControls?.()">
  </label>
</div>

<!-- ── Scripts ─────────────────────────────────────────────────────────── -->

<!-- Bridge: spawns emu-worker.js which loads ares-web.wasm internally.
     No ares-web.js on the main thread — WASM runs in the Worker. -->
<script src="bridge.js"></script>
<!-- Virtual gamepad overlay -->
<script src="touch-controls.js"></script>

<script>
  // ─── Touch controls init ─────────────────────────────────────────────────
  // window.Module is the proxy defined in bridge.js; TouchControls uses it
  // to call _ares_set_button / _ares_set_axis.
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof TouchControls !== 'undefined') TouchControls.init(window.Module);
  });

  // ─── UI helpers ─────────────────────────────────────────────────────────

  function enterFullscreen() {
    const el = document.getElementById('canvas-container');
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  }

  function toggleKeyRef() {
    document.getElementById('key-ref').classList.toggle('visible');
  }

  function toggleSettings() {
    document.getElementById('settings-panel').classList.toggle('visible');
  }

  function setVolume(val) {
    document.getElementById('vol-label').textContent = val + '%';
    if (window._aresGainNode) window._aresGainNode.gain.value = val / 100;
  }

  function setScale(mode) {
    const c = document.getElementById('ares-canvas');
    if (mode === 'fit') {
      c.style.width = ''; c.style.height = '';
      c.style.maxWidth = '100%'; c.style.maxHeight = '100%';
    } else {
      const factor = parseInt(mode, 10);
      c.style.width  = (640 * factor) + 'px';
      c.style.height = (480 * factor) + 'px';
      c.style.maxWidth = 'none'; c.style.maxHeight = 'none';
    }
  }

  // ─── Drag-over visual ───────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', () => {
    const cc = document.getElementById('canvas-container');
    cc.addEventListener('dragenter', () => cc.classList.add('drag-over'));
    cc.addEventListener('dragleave', (e) => {
      if (!cc.contains(e.relatedTarget)) cc.classList.remove('drag-over');
    });
    cc.addEventListener('drop', () => cc.classList.remove('drag-over'));
  });

  // ─── Service worker registration ────────────────────────────────────────

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        console.info('[sw] registered, scope:', reg.scope);
      }).catch((e) => {
        console.warn('[sw] registration failed:', e);
      });
    });
  }

  // ─── PWA install prompt ──────────────────────────────────────────────────

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.createElement('button');
    btn.textContent = 'Install';
    btn.onclick = async () => {
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') btn.remove();
      deferredInstallPrompt = null;
    };
    document.getElementById('controls').prepend(btn);
  });
</script>

</body>
</html>
